<!DOCTYPE html>
<html>
<head>
    <title>Diffie-Hellman Key Exchange</title>
</head>
<body>

<h2>Diffie-Hellman Key Exchange</h2>

<label>Enter Prime Number (p): </label>
<input type="number" id="p"><br><br>

<label>Enter Primitive Root (g): </label>
<input type="number" id="g"><br><br>

<label>Enter your Private Key (Alice): </label>
<input type="number" id="a"><br><br>

<button onclick="calculate()">Generate Shared Key</button>

<h3>Results:</h3>
<p id="result"></p>

<script>
/*
 * DIFFIE-HELLMAN KEY EXCHANGE
 * Theory: Diffie-Hellman is NOT an encryption algorithm. It is a Key Exchange Protocol.
 * It allows two parties (Alice and Bob) who have never met to establish a shared secret key
 * over a public, unsecured channel. Once the shared key is created, they can use it 
 * with symmetric encryption (like AES or DES) to actually send secure messages.
 * 
 * The security relies on the "Discrete Logarithm Problem": 
 * Given exactly (g^a % p), it's practically impossible to mathematically reverse it 
 * to figure out what the private exponent 'a' was, provided 'p' is a large prime.
 */

// Modular exponentiation
function modExp(base, exp, mod) {
    let result = 1;
    base = base % mod;

    while (exp > 0) {
        if (exp % 2 === 1)
            result = (result * base) % mod;

        exp = Math.floor(exp / 2);
        base = (base * base) % mod;
    }
    return result;
}

function calculate() {
    let p = parseInt(document.getElementById("p").value);
    let g = parseInt(document.getElementById("g").value);
    let a = parseInt(document.getElementById("a").value);

    // Bob's private key (random)
    let b = Math.floor(Math.random() * 10) + 1;

    // Public keys
    let A = modExp(g, a, p);
    let B = modExp(g, b, p);

    // Shared keys
    let keyAlice = modExp(B, a, p);
    let keyBob = modExp(A, b, p);

    document.getElementById("result").innerHTML =
        "Bob's Private Key: " + b + "<br>" +
        "Alice's Public Key (A): " + A + "<br>" +
        "Bob's Public Key (B): " + B + "<br>" +
        "Shared Key (Alice): " + keyAlice + "<br>" +
        "Shared Key (Bob): " + keyBob;
}

/*
 * ==========================================
 * DIFFIE-HELLMAN EXECUTION FLOW
 * ==========================================
 * 1. Public agreement: Both agree on a prime number (p) and a primitive root (g).
 * 2. Private Keys: Alice picks a secret 'a'. Bob (the JS code) picks a secret 'b'.
 * 3. Public Keys Calculation:
 *    - Alice calculates A = (g^a) % p
 *    - Bob calculates B = (g^b) % p
 * 4. Exchange: They "exchange" Public Keys (A and B).
 * 5. Shared Secret Calculation:
 *    - Alice uses Bob's public B: Secret = (B^a) % p
 *    - Bob uses Alice's public A: Secret = (A^b) % p
 *    - The mathematics guarantee both calculations result in the EXACT same number.
 * 
 * ==========================================
 * DRY RUN EXAMPLE
 * ==========================================
 * User Inputs in HTML: Prime (p) = 23, Primitive Root (g) = 5
 * Alice's Private Key (a) = 4
 * Bob's Private Key (b) = 3 (Randomly generated by JS out of 1-10)
 * 
 * 1. Calculate Public Keys:
 *    - Alice (A): (5^4) % 23 = 625 % 23 = 4
 *    - Bob (B):   (5^3) % 23 = 125 % 23 = 10
 * 
 * 2. The Exchange Happens (Alice gets Bob's 10, Bob gets Alice's 4)
 * 
 * 3. Shared Key Calculation:
 *    - Alice computes: (B^a) % p => (10^4) % 23 = 10000 % 23 = 18
 *    - Bob computes:   (A^b) % p => (4^3) % 23  = 64 % 23 = 18
 * 
 * Shared Key perfectly matches = 18! Both parties now share this key safely.
 */
</script>

</body>
</html>
